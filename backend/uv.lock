version = 1
requires-python = ">=3.11"

[[package]]
name = "asgiref"
version = "3.8.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "typing-extensions", marker = "python_version < '3.11'" },
]

[[package]]
name = "django"
version = "4.2.13"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "asgiref", specifier = ">=3.6.0,<4" },
    { name = "sqlparse", specifier = ">=0.2.2" },
    { name = "tzdata", marker = "sys_platform == 'win32'" },
]

[[package]]
name = "djangorestframework"
version = "3.14.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "django", specifier = ">=3.0" },
]

[[package]]
name = "sqlparse"
version = "0.5.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "typing-extensions"
version = "4.12.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "tzdata"
version = "2024.2"
source = { registry = "https://pypi.org/simple" }
